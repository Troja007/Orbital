    - "The method was live-tested through Orbital against one Windows host and returned one RunMRU last-command row."
    - "The full-list SQL pattern uses the same checked registry table and RunMRU artifact logic; it should be live-tested during the next Run history investigation before changing the whole method status to validated."
    - "Endpoint-specific values, hostnames, user SIDs, node IDs, query IDs, and returned commands were not stored."

lessons:
  - date: "2026-08-13"
    note: "Windows Run dialog history is stored per user in RunMRU. MRUList gives the ordering; the first character identifies the most recent command value."
  - date: "2026-08-13"
    note: "For Run dialog history investigations, prefer collecting the full MRU-ordered RunMRU list rather than only the latest entry when the analyst asks to investigate the Run app activity."
  - date: "2026-08-13"
    note: "RunMRU is not complete process execution evidence. Use it with UserAssist, Prefetch, PowerShell logs, Security 4688, Sysmon, or EDR telemetry when the investigation needs execution corroboration."

