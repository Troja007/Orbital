osquery_context:
  tables:
    - name: "registry"
      columns:
        - "key"
        - "path"
        - "name"
        - "type"
        - "data"
        - "mtime"
      platform_notes:
        - "Windows table. Queries loaded registry hives visible to osquery."
        - "RunMRU history is per user under HKEY_USERS/<SID>/Software/Microsoft/Windows/CurrentVersion/Explorer/RunMRU."
  joins:
    - "Self-join RunMRU values to the MRUList value by registry key."
  constraints:
    - "Constrain key to HKEY_USERS\\%\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU."
    - "Use the first character of MRUList to select the most recent value."

orbital_guidance:
  preferred_query_type: "live_query"
  allow_os:
    - "windows"
  target_selector_guidance:
    - "Use one exact host:<hostname> or orb:<node_id> selector for triage."
    - "Use broad Windows targeting only with explicit approval."
  broad_targeting_risk:
    level: "low"
    notes:
      - "Registry-only query is lightweight, but broad user-history collection can have privacy impact and should remain scoped."

sql_patterns:
  - name: "Most recent RunMRU command for loaded user hives"
    description: "Returns one row per loaded user RunMRU key where MRUList exists and the most recent value is present."
    sql: |
      WITH runmru AS (
        SELECT
          key,
          name,
          data
        FROM registry
        WHERE key LIKE 'HKEY_USERS\%\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'
      ),
      mru_order AS (
        SELECT
          key,
          data AS mru_list,
          substr(data, 1, 1) AS most_recent_value_name
        FROM runmru
        WHERE name = 'MRUList'
      )
      SELECT
        replace(r.key, 'HKEY_USERS\', '') AS user_sid_and_key,
        r.name AS mru_value,
        replace(r.data, '\1', '') AS last_run_command,
        m.mru_list
      FROM runmru r
      JOIN mru_order m
        ON r.key = m.key
       AND r.name = m.most_recent_value_name
      ORDER BY r.key;
  - name: "Full RunMRU command list for loaded user hives"
    description: "Returns all cached Run dialog commands per loaded user RunMRU key, ordered from most recent to oldest according to MRUList."
    sql: |
      WITH runmru AS (
        SELECT
          key,
          name,
          data
        FROM registry
        WHERE key LIKE 'HKEY_USERS\%\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'
      ),
      mru_order AS (
        SELECT
          key,
          data AS mru_list
        FROM runmru
        WHERE name = 'MRUList'
      )
      SELECT
        replace(r.key, 'HKEY_USERS\', '') AS user_sid_and_key,
        r.name AS mru_value,
        replace(r.data, '\1', '') AS run_command,
        instr(m.mru_list, r.name) AS mru_position,
        m.mru_list
      FROM runmru r
      JOIN mru_order m
        ON r.key = m.key
      WHERE r.name <> 'MRUList'
        AND instr(m.mru_list, r.name) > 0
      ORDER BY r.key, mru_position;

