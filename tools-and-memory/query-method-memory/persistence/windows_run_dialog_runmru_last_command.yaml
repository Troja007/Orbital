title: "Query Windows Run dialog history"
status: "tested"
created: "2026-08-13"
updated: "2026-08-13"
category: "persistence"
platforms:
  - "windows"

investigation_inputs:
  source_type: "analyst_question"
  examples:
    - "Check the last command executed using the Windows Run app on a specific endpoint."
    - "Investigate the Windows Run dialog history for a specific endpoint."
    - "Query the Run dialog history for the most recent command on a Windows host."
    - "Show the list of cached commands from the Windows Run app."
    - "Show the latest command cached in RunMRU for a Windows user."
  raw_input_handling:
    store_raw_chat: false
    sanitization_required: true
    notes:
      - "Store the request pattern only. Do not store hostnames, SIDs, returned commands, or query result rows."
  keywords:
    - "RunMRU"
    - "Run dialog"
    - "Win+R"
    - "Start Run"
    - "run command history"
    - "registry"
  threat_context:
    category: "registry"
    platforms:
      - "windows"

query_goal:
  question: "Determine cached Windows Run dialog commands for each loaded user hive on a target endpoint, either as the full MRU-ordered history or only the latest entry."
  expected_information:
    - "User SID and RunMRU registry key path."
    - "Registry value name selected by the first character of MRUList."
    - "Most recent Run dialog command string after removing the RunMRU terminator."
    - "MRU-ordered Run dialog command list when the investigation needs more than the latest entry."
    - "Full MRUList ordering string for interpretation."
  answers:
    - "Which command appears most recent in the Windows Run dialog history for each loaded user hive."
    - "Which commands are cached in the Windows Run dialog history and their MRU order."
  use_when:
    - "The analyst asks for the last command entered through the Windows Run dialog or Start menu Run app."
    - "The analyst asks to investigate Run dialog history rather than only the latest Run command."
    - "The target is a specific Windows host or a narrow explicitly approved Windows target set."
    - "The investigation needs lightweight per-user Run dialog artifact evidence."
  do_not_use_when:
    - "The analyst needs complete process execution history."
    - "The command may have been launched through PowerShell, cmd.exe, Explorer, scheduled task, service control, or another mechanism instead of the Run dialog."
    - "The user hive may not be loaded and offline NTUSER.DAT parsing is required."
  does_not_answer:
    - "Who typed the command beyond the loaded user SID context."
    - "Whether the command actually completed successfully."
    - "All commands ever executed on the endpoint."
    - "Commands launched outside the Windows Run dialog."
  preferred_next_queries:
    - "UserAssist registry evidence for Explorer-launched GUI applications."
    - "Prefetch evidence for executable launches if Prefetch is enabled."
    - "PowerShell logs for script or command-line activity."
    - "Security 4688 or Sysmon process creation telemetry if available."

